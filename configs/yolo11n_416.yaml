# BISINDO YOLO11n — experiment: input 416 px instead of 320, everything else as yolo11n.yaml.
# All training params live here, not scattered in code.
# Values are validated starting points for 26-class hand-sign detection, not universal defaults.

seed: 42
model: yolo11n.pt          # nano: ~2.6M params, fits 4GB + fast enough for browser export later
data: data/bisindo.yaml    # generated by scripts/make_group_splits.py (flat YOLO layout)

# Input resolution: 416 here (baseline 320) to give the model more finger detail.
imgsz: 416                 # experiment: the only change vs yolo11n.yaml (targets M<->N finger-count confusions)
batch: 4                   # 4GB laptop (WDDM reserves ~1GB, ~3GB usable) OOMs at batch 8/imgsz 320.
                           # Raise to 8 only if nvidia-smi shows headroom after 1-epoch probe.
epochs: 50
patience: 15               # early stopping on val mAP; best ckpt kept, never overwritten
workers: 1                 # 2 workers crashed twice with cv2 OutOfMemory (host RAM) on this laptop
device: 0                  # CUDA GPU; CPU only for smoke test with --device cpu
amp: true                  # mixed precision on CUDA
optimizer: AdamW
lr0: 0.001                 # head LR; backbone uses lower effective LR via warmup + momentum
weight_decay: 0.0005
warmup_epochs: 3
scheduler: cosine
label_smoothing: 0.0       # enable 0.1 only as isolated experiment
dropout: 0.0
mosaic: 0.5                # moderate; full 1.0 can destroy small-hand structure
fliplr: 0.0                # DISABLED: horizontal flip can change BISINDO hand meaning
flipud: 0.0
hsv_h: 0.015
hsv_s: 0.5
hsv_v: 0.3
degrees: 5.0               # small rotation only; large rotation changes sign semantics
translate: 0.05
scale: 0.3
erasing: 0.0

# Validation / selection: select on val mAP50-95, report the rest.
metric: map50-95
split_version: v2          # v1 random split leaked (augmented copies across splits); v2 = group-aware by pHash
dataset_version: bisindo-raw-2026-09
notes: "imgsz 320->416, everything else equal to yolo11n.yaml"
